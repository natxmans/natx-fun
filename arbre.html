<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>L'Arbre Magique · natx.fun</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="stylesheet" href="commun.css?v=2">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icone-192.png">
<meta name="theme-color" content="#fbf7f0">
<script src="commun.js?v=2"></script>
<style>
  html, body { height: 100%; overflow: hidden; }
  body { touch-action: none; user-select: none; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; cursor: pointer; }
  .astuce {
    position: fixed; top: 20px; left: 0; right: 0; text-align: center; margin: 0; padding: 0 170px;
    font-family: var(--titre); font-weight: 600; font-size: clamp(16px, 3vw, 22px); pointer-events: none;
  }
  .barre {
    position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
    width: max-content; max-width: calc(100% - 24px);
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    background: #fff; border: 3px solid var(--encre); border-radius: 20px; box-shadow: 0 5px 0 var(--encre); padding: 10px 12px;
  }
  .barre .btn { font-size: 15px; padding: 7px 12px; }
  .barre .btn.actif { background: #fde68a; }
  @media (max-width: 600px) { .astuce { padding: 0 16px; top: 64px; } }
</style>
</head>
<body>

<a class="retour" href="index.html">← natx.fun</a>
<canvas id="toile"></canvas>
<p class="astuce">Clique pour planter un arbre 🌱 (plus haut = plus grand)</p>
<nav class="barre">
  <button class="btn saison" data-s="printemps">🌸 Printemps</button>
  <button class="btn saison" data-s="ete">☀️ Été</button>
  <button class="btn saison actif" data-s="automne">🍂 Automne</button>
  <button class="btn saison" data-s="hiver">❄️ Hiver</button>
  <button class="btn" id="vent">🍃 Vent : calme</button>
  <button class="btn" id="auto">⏩ Saisons auto</button>
  <button class="btn" id="nuit">🌙 Nuit</button>
  <button class="btn" id="photo" title="Enregistrer l'image">📸</button>
  <button class="btn" id="effacer" title="Tout effacer">🧹</button>
</nav>

<script>
const SAISONS = {
  printemps: { ciel: ['#bfe3ff', '#fdf2f8'], sol: '#7cc46a', feuilles: ['#ffb7c5', '#ff9eb5', '#ffd1dc', '#fff0f5', '#9be38a'] },
  ete: { ciel: ['#7cc6fe', '#e0f4ff'], sol: '#4fa84a', feuilles: ['#3a9d4f', '#52b860', '#2f7d3e', '#7ccf6b'] },
  automne: { ciel: ['#fbc2a4', '#fde8d0'], sol: '#b7791f', feuilles: ['#e8590c', '#f59f00', '#d9480f', '#ffd43b', '#c92a2a'] },
  hiver: { ciel: ['#c9d6e3', '#f1f5f9'], sol: '#f8fafc', feuilles: ['#ffffff'] },
};
const PROF_MAX = 8;
// Différentes formes d'arbres : [écart min, écart en plus] et [réduction min, réduction en plus]
const ESPECES = [
  { ecart: [.3, .35], reduc: [.68, .16] },
  { ecart: [.14, .2], reduc: [.74, .12] },
  { ecart: [.5, .35], reduc: [.64, .14] },
];
let espece = ESPECES[0], nuit = false, auto = null;
const ETOILES = Array.from({ length: 140 }, () => ({ x: Math.random(), y: Math.random() * .75, r: .4 + Math.random() * 1.3, p: Math.random() * 6 }));
const LUCIOLES = Array.from({ length: 36 }, () => ({ x: Math.random(), y: .55 + Math.random() * .4, p: Math.random() * 6, v: .3 + Math.random() * .7 }));

const toile = document.getElementById('toile');
const ctx = toile.getContext('2d');
let W, H, sol, dpr, saison = 'automne', ventFort = false;
let arbres = [], particules = [];

function redimensionner() {
  dpr = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  toile.width = W * dpr; toile.height = H * dpr;
  sol = H - 90;
}
addEventListener('resize', redimensionner);
redimensionner();

// Un arbre = une branche qui contient d'autres branches (récursif)
function branche(prof, long, angle) {
  const b = { prof, long, angle, enfants: [], feuilles: null };
  if (prof < PROF_MAX && long > 3) {
    const n = Math.random() < .12 ? 3 : 2;
    for (let i = 0; i < n; i++) {
      const ecart = espece.ecart[0] + Math.random() * espece.ecart[1];
      const a = (n === 2 ? (i ? 1 : -1) * ecart : (i - 1) * ecart) + (Math.random() - .5) * .3;
      b.enfants.push(branche(prof + 1, long * (espece.reduc[0] + Math.random() * espece.reduc[1]), a));
    }
  } else {
    b.feuilles = Array.from({ length: 4 }, () => ({
      dx: (Math.random() - .5) * 16, dy: (Math.random() - .5) * 16, r: 4 + Math.random() * 5, c: Math.random(),
    }));
  }
  return b;
}

function planter(x, echelle) {
  espece = ESPECES[Math.floor(Math.random() * ESPECES.length)];
  arbres.push({
    x, echelle, t0: performance.now() / 1000, phase: Math.random() * 6,
    largeur: 16 * echelle,
    racine: branche(0, Math.min(H * .17, 150) * echelle, (Math.random() - .5) * (Math.random() < .25 ? .45 : .1)),
  });
  if (arbres.length > 6) arbres.shift();
}

let traits, bouts;
function parcourir(arbre, b, x, y, angleParent, t, amp) {
  const debut = arbre.t0 + b.prof * .2;
  const p = Math.min(1, (t - debut) / .25);
  if (p <= 0) return;
  const balance = Math.sin(t * 1.6 + arbre.phase + b.prof * .6) * amp * (b.prof / PROF_MAX);
  const a = angleParent + b.angle + balance;
  const x2 = x + Math.sin(a) * b.long * p, y2 = y - Math.cos(a) * b.long * p;
  (traits[b.prof] ||= []).push(x, y, x2, y2);
  if (p < 1) return;
  for (const e of b.enfants) parcourir(arbre, e, x2, y2, a, t, amp);
  if (b.feuilles) {
    const pop = Math.min(1, Math.max(0, (t - debut - .25) / .4));
    if (pop > 0) bouts.push([x2, y2, b.feuilles, pop]);
  }
}

function dessiner(t) {
  const s = SAISONS[saison];
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const g = ctx.createLinearGradient(0, 0, 0, sol);
  const ciel = nuit ? ['#0b1026', '#2a3560'] : s.ciel;
  g.addColorStop(0, ciel[0]); g.addColorStop(1, ciel[1]);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
  if (nuit) {
    ctx.fillStyle = '#fff';
    for (const e of ETOILES) {
      ctx.globalAlpha = .4 + .6 * Math.abs(Math.sin(t + e.p));
      ctx.beginPath(); ctx.arc(e.x * W, e.y * sol, e.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.globalAlpha = 1;
    const lx = W * .82, ly = Math.min(H * .18, 140);
    const halo = ctx.createRadialGradient(lx, ly, 20, lx, ly, 90);
    halo.addColorStop(0, 'rgba(254,243,199,.35)'); halo.addColorStop(1, 'rgba(254,243,199,0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(lx, ly, 90, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fef3c7';
    ctx.beginPath(); ctx.arc(lx, ly, 30, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = s.sol;
  ctx.fillRect(0, sol, W, H - sol);
  ctx.fillStyle = 'rgba(0,0,0,.08)';
  ctx.fillRect(0, sol, W, 4);

  const amp = (ventFort ? .09 : .025) * (1 + .5 * Math.sin(t * .3));
  const tousLesBouts = [];
  ctx.strokeStyle = '#5b3a29';
  ctx.lineCap = 'round';
  for (const arbre of arbres) {
    traits = []; bouts = [];
    parcourir(arbre, arbre.racine, arbre.x, sol + 2, 0, t, amp);
    // On dessine toutes les branches d'un même niveau d'un coup (même épaisseur)
    traits.forEach((seg, prof) => {
      ctx.lineWidth = Math.max(1, arbre.largeur * .68 ** prof);
      ctx.beginPath();
      for (let i = 0; i < seg.length; i += 4) { ctx.moveTo(seg[i], seg[i + 1]); ctx.lineTo(seg[i + 2], seg[i + 3]); }
      ctx.stroke();
    });
    tousLesBouts.push(...bouts);
  }

  // Feuilles regroupées par couleur
  const couleurs = s.feuilles;
  const parCouleur = couleurs.map(() => []);
  for (const [x, y, feuilles, pop] of tousLesBouts) {
    for (const f of feuilles) {
      if (saison === 'hiver' && f.c > .35) continue;
      const r = f.r * pop * (saison === 'hiver' ? .6 : 1);
      parCouleur[Math.floor(f.c * couleurs.length) % couleurs.length].push(x + f.dx, y + f.dy, r);
    }
  }
  parCouleur.forEach((liste, i) => {
    ctx.fillStyle = couleurs[i];
    ctx.beginPath();
    for (let k = 0; k < liste.length; k += 3) {
      ctx.moveTo(liste[k] + liste[k + 2], liste[k + 1]);
      ctx.arc(liste[k], liste[k + 1], liste[k + 2], 0, Math.PI * 2);
    }
    ctx.fill();
  });
  if (nuit) { ctx.fillStyle = 'rgba(8,12,40,.35)'; ctx.fillRect(0, 0, W, H); }
  return tousLesBouts;
}

// Lucioles qui clignotent les nuits d'été
function lucioles(t) {
  for (const l of LUCIOLES) {
    const x = (l.x + Math.sin(t * l.v * .3 + l.p) * .03) * W;
    const y = (l.y + Math.cos(t * l.v * .4 + l.p) * .03) * sol;
    const a = Math.max(0, Math.sin(t * 3 * l.v + l.p));
    const g = ctx.createRadialGradient(x, y, 0, x, y, 9);
    g.addColorStop(0, `rgba(217,249,157,${a})`); g.addColorStop(1, 'rgba(217,249,157,0)');
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI * 2); ctx.fill();
  }
}

// Feuilles qui tombent (automne), pétales (printemps), neige (hiver)
function animerParticules(dt, t, bouts) {
  const s = SAISONS[saison];
  if (saison === 'hiver' && particules.length < 300) {
    for (let i = 0; i < 2; i++) particules.push({ x: Math.random() * W, y: -5, vx: 0, vy: 30 + Math.random() * 30, r: 1.5 + Math.random() * 2, c: '#fff', ph: Math.random() * 6 });
  } else if ((saison === 'automne' || saison === 'printemps') && bouts.length && Math.random() < (saison === 'automne' ? .5 : .25)) {
    const [x, y] = bouts[Math.floor(Math.random() * bouts.length)];
    particules.push({ x, y, vx: 0, vy: 25 + Math.random() * 25, r: 3 + Math.random() * 3, c: s.feuilles[Math.floor(Math.random() * s.feuilles.length)], ph: Math.random() * 6 });
  }
  const vent = ventFort ? 60 : 15;
  for (const p of particules) {
    p.x += (Math.sin(t * 2 + p.ph) * 25 + vent) * dt;
    p.y += p.vy * dt;
  }
  particules = particules.filter(p => p.y < sol + 4 && p.x < W + 20);
  for (const p of particules) {
    ctx.fillStyle = p.c;
    ctx.beginPath();
    if (p.c === '#fff') ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    else ctx.ellipse(p.x, p.y, p.r, p.r * .55, Math.sin(t * 3 + p.ph), 0, Math.PI * 2);
    ctx.fill();
  }
}

let avant = performance.now();
function boucle(maintenant) {
  const dt = Math.min(.05, (maintenant - avant) / 1000);
  avant = maintenant;
  const t = maintenant / 1000;
  const bouts = dessiner(t);
  animerParticules(dt, t, bouts);
  if (nuit && saison === 'ete') lucioles(t);
  requestAnimationFrame(boucle);
}
requestAnimationFrame(boucle);

toile.addEventListener('pointerdown', e => {
  const hauteur = Math.min(1, Math.max(0, (sol - e.clientY) / (sol * .9)));
  planter(e.clientX, .55 + hauteur * .6);
});

document.querySelectorAll('.saison').forEach(b => b.addEventListener('click', () => {
  saison = b.dataset.s;
  particules = [];
  document.querySelectorAll('.saison').forEach(x => x.classList.toggle('actif', x === b));
}));
document.getElementById('vent').addEventListener('click', e => {
  ventFort = !ventFort;
  e.currentTarget.textContent = ventFort ? '🌪️ Vent : fort' : '🍃 Vent : calme';
});
document.getElementById('effacer').addEventListener('click', () => { arbres = []; particules = []; });

const ORDRE = ['printemps', 'ete', 'automne', 'hiver'];
document.getElementById('auto').addEventListener('click', e => {
  const b = e.currentTarget;
  if (auto) { clearInterval(auto); auto = null; }
  else {
    auto = setInterval(() => document.querySelector(`.saison[data-s="${ORDRE[(ORDRE.indexOf(saison) + 1) % 4]}"]`).click(), 7000);
    natx.toast('⏩ Les saisons défilent toutes seules');
  }
  b.classList.toggle('actif', !!auto);
});
document.getElementById('nuit').addEventListener('click', e => {
  nuit = !nuit;
  e.currentTarget.textContent = nuit ? '☀️ Jour' : '🌙 Nuit';
  if (nuit && saison === 'ete') natx.toast('✨ Regarde les lucioles !');
});
document.getElementById('photo').addEventListener('click', () => {
  toile.toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'arbre-magique.png';
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
    natx.son('bon');
    natx.toast('📸 Image enregistrée !');
  });
});

planter(W / 2, 1);
</script>
</body>
</html>
